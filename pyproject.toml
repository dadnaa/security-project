[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imsi-training-lab"
version = "0.1.0"
description = "IMSI Catcher & Rogue BTS Training Lab"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["flask>=2.3"]

[project.scripts]
lab = "lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab = ["ui/templates/*.html", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
